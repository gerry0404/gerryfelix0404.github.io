<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Payment Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
            padding: 40px;
        }

        .calculator {
            background-color: white;
            max-width: 450px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px #cccccc;
        }

        h1 {
            color: #222222;
        }

        label {
            display: block;
            margin-top: 20px;
            font-weight: bold;
        }

        input {
            padding: 10px;
            width: 90%;
            margin-top: 8px;
            border: 1px solid #cccccc;
            border-radius: 5px;
        }

        button {
            background-color: #e63946;
            color: white;
            border: none;
            padding: 12px 25px;
            margin-top: 25px;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background-color: #c92a36;
        }

        #result {
            margin-top: 25px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>

    <script>
        function calculatePayment() {
            let PV = Number(document.getElementById("loan").value);
            let n = Number(document.getElementById("years").value);
            let r = Number(document.getElementById("rate").value);

            if (PV <= 0 || n <= 0 || r <= 0 ||
                !Number.isFinite(PV) ||
                !Number.isFinite(n) ||
                !Number.isFinite(r)) {
                document.getElementById("result").innerHTML =
                    "Please enter valid positive numbers.";
                return;
            }

            let P = ((r/100/12) * PV) / (1-(1+(r/100/12))**-(n*12));

            document.getElementById("result").innerHTML =
                "If you have a $" + PV +
                " loan for " + n +
                " years at " + r +
                "% annual interest, your monthly payment will be $" +
                P.toFixed(2) + ".";
        }
    </script>
</head>

<body>

    <div class="calculator">
        <h1>Loan Payment Calculator</h1>

        <p>Enter your loan information to calculate your monthly payment.</p>

        <label for="loan">Loan Amount ($)</label>
        <input type="number" id="loan" placeholder="Example: 25000" min="0" step="any">

        <label for="years">Number of Years</label>
        <input type="number" id="years" placeholder="Example: 6" min="0" step="any">

        <label for="rate">Annual Interest Rate (%)</label>
        <input type="number" id="rate" placeholder="Example: 6" min="0" step="any">

        <button onclick="calculatePayment()">Calculate Payment</button>

        <p id="result"></p>
    </div>

</body>
</html>
