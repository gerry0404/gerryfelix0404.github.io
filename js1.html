<!DOCTYPE html>
<html>
<head>
    <title>My JavaScript Calculator</title>
</head>
<body>

    <h1>My First JavaScript Calculator</h1>

    <p>Enter two numbers to add:</p>

    <input type="number" id="num1" placeholder="First number">
    <input type="number" id="num2" placeholder="Second number">

    <button onclick="addNumbers()">Calculate</button>

    <h2 id="result">Result will appear here</h2>

    <script>
        function addNumbers() {
            let number1 = Number(document.getElementById("num1").value);
            let number2 = Number(document.getElementById("num2").value);

            let sum = number1 + number2;

            document.getElementById("result").innerHTML = "The answer is: " + sum;
        }
    </script>

</body>
</html>
